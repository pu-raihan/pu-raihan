<svg xmlns="http://www.w3.org/2000/svg" width="440" height="160" viewBox="0 0 440 160" role="img"
    font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif">
    <defs>
        <linearGradient id="g" x1="0" y1="0" x2="1" y2="1">
            <stop offset="0" stop-color="#7c3aed" />
            <stop offset="1" stop-color="#06b6d4" />
        </linearGradient>
        <linearGradient id="pg" x1="0" y1="0" x2="1" y2="1">
            <stop offset="0" stop-color="#06b6d4" />
            <stop offset="1" stop-color="#22c55e" />
        </linearGradient>
        <clipPath id="logoClip">
            <rect x="20" y="20" width="48" height="48" rx="14" />
        </clipPath>
    </defs>
    <rect x=".5" y=".5" width="439" height="159" rx="18" fill="#111827" stroke="#1f2a44" />
    <g clip-path="url(#logoClip)">
        <image
            href="data:image/png;base64,"
            x="20" y="20" width="48" height="48" preserveAspectRatio="xMidYMid slice" />
    </g>
    <text x="44" y="52" font-size="22" font-weight="800" fill="#fff" text-anchor="middle"></text>
    <text x="82" y="42" font-size="17" font-weight="700" fill="#e5e7eb">Wahat Al Romman</text>
    <text x="82" y="61" font-size="11.5" fill="#94a3b8"
        font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace">professional</text>
    <circle cx="404" cy="44" r="16" fill="#0f172a" stroke="#1f2a44" />
    <text x="404" y="49" font-size="15" fill="#e5e7eb" text-anchor="middle">↗</text>
    <text x="20" y="92" font-size="13" fill="#94a3b8">Public website for a food stuffs company based
        in the</text>
    <text x="20" y="111" font-size="13" fill="#94a3b8">UAE.</text>
    <rect x="20" y="124" width="86.2" height="24" rx="12.0" fill="#0f172a" stroke="#1f2a44" />
    <circle cx="36" cy="136.0" r="4" fill="#06b6d4" />
    <text x="48.0" y="140.0" font-size="11" fill="#e5e7eb" font-weight="500">Website</text>
</svg>